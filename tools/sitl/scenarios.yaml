# SITL-7 VTOL 오프보드 전면 회귀 캠페인 — 시나리오 정의
#
# 근거 문서: docs/sitl_vtol_campaign.md 3장.
# 실행:      python3 tools/sitl/run_scenario.py <id>   (WSL Ubuntu-22.04 안에서)
# 분석:      python3 tools/sitl/analyze_run.py <id>
#
# 스키마
#   id          : 시나리오 식별자 (산출물 디렉터리 이름)
#   desc        : 목적 한 줄
#   model       : PX4 SITL 모델 (기본 defaults.model = gz_standard_vtol)
#   launch_args : phase2.launch.py 에 `key:=value` 로 그대로 전달되는 dict.
#                 값은 전부 문자열로 적는다(YAML이 숫자로 바꿔 포맷이 흔들리는 것을 막음).
#                 여기 비어 있는 파라미터는 fc_ros_params.yaml 정식값이 쓰인다.
#   timeout_s   : 이 시간(초) 안에 DONE에 도달하지 못하면 강제 종료 (exit 2)
#   home        : (옵션) PX4_HOME_LAT/LON/ALT 환경변수. C8 통제조건용
#   inject      : (옵션) 장애주입 훅 목록. 각 항목:
#                   on_state : 이 상태 진입이 node.log에서 관측되면 트리거
#                              (ARM_TAKEOFF/CLIMBING/TRANSITION_FW/STREAMING/
#                               ENTRY/FOLLOWING/TRANSITION_MC/HOLD/LANDING/DONE)
#                   on_log   : node.log 의 임의 문장 정규식이 처음 매치되면 트리거.
#                              Monitor 가 이미 증분으로 읽는 스트림이라 지연이
#                              루프주기(0.1s)뿐 — **짧은 구간을 노릴 때 유일하게
#                              쓸 수 있는 트리거**다 (S7 추가, 아래 C3 참조)
#                   on_vtol_state : 이 vtol_state 값이 MAVROS에서 관측되면 트리거
#                              (1=천이중MC→FW, 2=천이중FW→MC, 3=MC, 4=FW)
#                              ⚠️ `ros2 topic echo --once` 폴링이라 한 바퀴 1~2초 —
#                              3초 미만 구간은 통째로 놓친다(C3 1차 실행 실측)
#                   at_s     : 런 시작으로부터 절대 경과시간(초) 트리거
#                   delay_s  : 트리거 성립 후 추가 지연(초), 기본 0
#                   action   : set_mode | override | param_set | probe
#                     set_mode  → mode:  (예 AUTO.LOITER / POSCTL / MANUAL)
#                     override  → /fc_ros/override 에 std_msgs/Bool true 1회 발행
#                     param_set → param: / value:  (ros2 param set /mavros/param)
#                     probe     → topic: 을 --once 로 떠서 inject 결과에 기록(무해)
#
#   액션 검증 상태(S7 기준): probe(A1) · set_mode(C3/C7) · override(C6a/C6b) 실사용 검증됨.
#   **param_set 은 아직 미검증이다.**
#   set_mode/override 는 하니스의 in-process rclpy 클라이언트로 나간다(왕복 ~0.003s).
#   CLI 폴백은 4.04s 가 걸리므로 짧은 구간을 노릴 땐 폴백이 걸렸는지
#   meta.json 의 inject_transport / inject_results[].via 로 반드시 확인할 것.

defaults:
  model: gz_standard_vtol
  timeout_s: 420

scenarios:

  # ── Phase 1 — 기준선 회귀 (SITL-4 재현) ─────────────────────────────────
  - id: A1
    desc: "SITL-4 직선 300m 재현 (3주치 변경 후 회귀 여부). waypoint_frame=local(SITL-4 당시 동작)"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 300.0,0.0,50.0]"
      waypoint_frame: "local"
    timeout_s: 420
    inject:
      # 하니스 훅 자체의 동작확인용 무해 프로브 (S1). 기체 거동에 영향 없음.
      - on_state: FOLLOWING
        delay_s: 3.0
        action: probe
        topic: /mavros/state

  - id: A2
    desc: "동일 경로, waypoint_frame=takeoff(현 기본값) — VTOL 첫 검증"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 300.0,0.0,50.0]"
    timeout_s: 420

  - id: A3
    desc: "SITL-4 L자 경로 재현 (90° 1회)"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 200.0,0.0,50.0, 200.0,200.0,50.0]"
    timeout_s: 480

  - id: A4
    desc: "중간 WP 고도가 다른 경로 → _cruise_alt 스칼라화(중간 WP z 무시) 실증"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 150.0,0.0,80.0, 300.0,0.0,50.0]"
    timeout_s: 480

  # ── Phase 2 — 경로 다양성 ───────────────────────────────────────────────
  - id: B1
    desc: "장거리 직선 500m — 순항 안정성"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 500.0,0.0,50.0]"
    timeout_s: 540

  - id: B2
    desc: "완만 곡선 4WP(30°급 꺾임) — eta3 NR 경로(_trapz 수정) 실행 검증"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 150.0,0.0,50.0, 300.0,80.0,50.0, 450.0,200.0,50.0]"
    timeout_s: 600

  - id: B3
    desc: "직각 코너(90°) — 코너 오버슈트 정량화"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 250.0,0.0,50.0, 250.0,250.0,50.0]"
    timeout_s: 540

  - id: B4
    desc: "예각/U턴(135°) — 선회반경 초과 시 거동"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 250.0,0.0,50.0, 100.0,150.0,50.0]"
    timeout_s: 540

  - id: B5
    desc: "사각 폐곡선(시점≈종점) — 종점 근접 오판 여부"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 200.0,0.0,50.0, 200.0,200.0,50.0, 0.0,200.0,50.0, 0.0,20.0,50.0]"
    timeout_s: 660

  - id: B6
    desc: "2-WP 최소 경로 (플래너 N≤2 특수케이스, NR 우회)"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 200.0,0.0,50.0]"
    timeout_s: 420

  - id: B7
    desc: "단거리 경로(40m, d_end_thresh=10m 대비 짧음) — FOLLOWING 즉시완료 오판"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 40.0,0.0,50.0]"
    timeout_s: 420

  - id: B8
    desc: "후방 경로(초기 헤딩과 180° 반대) — 헤딩 정렬 P제어 최악조건"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, -300.0,0.0,50.0]"
    timeout_s: 480

  # ── Phase 3 — 천이 집중 + 장애주입 ──────────────────────────────────────
  - id: C1a
    desc: "천이고도 민감도 — 저(20m). 경로는 A1"
    launch_args:
      transition_alt: "20.0"
      waypoints: "[0.0,0.0,50.0, 300.0,0.0,50.0]"
      waypoint_frame: "local"
    timeout_s: 420

  - id: C1b
    desc: "천이고도 민감도 — 고(120m). 경로는 A1"
    launch_args:
      transition_alt: "120.0"
      waypoints: "[0.0,0.0,50.0, 300.0,0.0,50.0]"
      waypoint_frame: "local"
    timeout_s: 540

  - id: C2
    desc: "헤딩 정렬 90° 조건 (동쪽 경로)"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 0.0,300.0,50.0]"
    timeout_s: 420

  - id: C3
    desc: "천이 중 OFFBOARD 강제 이탈 — AUTO.LOITER 주입 후 재요청 복구 확인"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 300.0,0.0,50.0]"
      waypoint_frame: "local"
    timeout_s: 480
    inject:
      # 노려야 하는 구간은 offboard_node 의 "ACTIVE TRANSITION" 서브페이즈 —
      # `천이 명령 요청` 로그부터 `FW 전환 완료` 까지. 이 구간에만
      # `천이 중 OFFBOARD 이탈 → 재요청` 복구 코드가 있다.
      # 1차 실행 실측으로 이 구간은 **2.60초**뿐이라(884.05→886.65)
      # `on_vtol_state: 1` 폴링(1~2초/바퀴)은 통째로 놓쳤다
      # → `C3_pxvehicle_try1_noinject` (트리거 미성립, 무주입 완주).
      # 그래서 구간 시작 로그에 직접 건다.
      - on_log: "MC→FW 천이 명령 요청"
        delay_s: 0.0
        action: set_mode
        mode: AUTO.LOITER

  - id: C4
    desc: "바람 주입 8m/s — A1 + 바람. gz wind 파라미터를 param_set/gz topic 으로 주입"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 300.0,0.0,50.0]"
      waypoint_frame: "local"
    timeout_s: 480
    # ✅ S7에서 바람 주입 방법 확정·실행 완료 (`C4_pxvehicle_wind8`).
    #    이 시나리오 정의만으로는 바람이 안 분다 — **월드를 바꿔 끼워야 한다.**
    #      1) default.sdf 를 복사해 world 이름과 <wind><linear_velocity> 만 바꾼 새 파일을
    #         **PX4 트리의 Tools/simulation/gz/worlds/ 안에** 만든다 (원본 무수정).
    #         `PX4_GZ_WORLDS` 로 트리 밖을 가리키는 건 통하지 않는다 —
    #         build/px4_sitl_default/rootfs/gz_env.sh:15 가 무조건 export 로 덮어쓴다.
    #      2) `PX4_GZ_WORLD=<이름>` 을 얹어 run_scenario.sh 실행 (meta.json 에 기록됨).
    #      3) 런이 끝나면 새 월드 파일 삭제.
    #    되는 이유: standard_vtol 의 gz LiftDrag 플러그인이 components::Wind 를 직접 조회한다
    #    → WindEffects 플러그인도 링크의 enable_wind 도 필요 없다.
    #    검증: EKF 풍속 추정 최대 7.89 m/s (주입 8.0). 상세는 S7_notes.md §4.
    inject:
      - at_s: 5.0
        action: probe
        topic: /mavros/state

  - id: C5a
    desc: "역천이 오버슈트 — d_end_thresh=10 (기본값)"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 300.0,0.0,50.0]"
      waypoint_frame: "local"
      d_end_thresh: "10.0"
    timeout_s: 420

  - id: C5b
    desc: "역천이 오버슈트 — d_end_thresh=30"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 300.0,0.0,50.0]"
      waypoint_frame: "local"
      d_end_thresh: "30.0"
    timeout_s: 420

  - id: C5c
    desc: "역천이 오버슈트 — d_end_thresh=60"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 300.0,0.0,50.0]"
      waypoint_frame: "local"
      d_end_thresh: "60.0"
    timeout_s: 420

  - id: C6a
    desc: "긴급 OVERRIDE — FW 순항(FOLLOWING) 중 /fc_ros/override true"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 300.0,0.0,50.0]"
      waypoint_frame: "local"
    timeout_s: 420
    inject:
      - on_state: FOLLOWING
        delay_s: 8.0
        action: override

  - id: C6b
    desc: "긴급 OVERRIDE — MC HOLD 중 /fc_ros/override true"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 300.0,0.0,50.0]"
      waypoint_frame: "local"
    timeout_s: 480
    inject:
      - on_state: HOLD
        delay_s: 3.0
        action: override

  - id: C7
    desc: "조종사 인계(PILOT_TAKEOVER) — FOLLOWING 중 POSCTL 강제 주입, 노드가 손을 떼는가"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 300.0,0.0,50.0]"
      waypoint_frame: "local"
    timeout_s: 420
    inject:
      - on_state: FOLLOWING
        delay_s: 8.0
        action: set_mode
        mode: POSCTL

  - id: C8
    desc: "home_amsl/geoid 회귀 (작업 H-2 체크리스트를 VTOL로) — 통제 HOME 좌표"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 300.0,0.0,50.0]"
    timeout_s: 420
    # 대회장(전북 새만금 인근) 실측 좌표계 — geoid separation 약 24.8m 구간.
    # 이 값으로 AMSL/타원체고 혼동이 재현되는지 본다.
    home:
      lat: "35.9078"
      lon: "126.5310"
      alt: "3.0"

  - id: C9
    desc: "STREAMING 오버슈트 재현 여부(미해결 이슈)가 VTOL에서도 나오는가 — A1 로그 정밀분석"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 300.0,0.0,50.0]"
      waypoint_frame: "local"
    timeout_s: 420

  - id: C10
    desc: "entry_mode=mid_flight (ENTRY 상태) — 거의 미검증 경로"
    launch_args:
      transition_alt: "50.0"
      waypoints: "[0.0,0.0,50.0, 300.0,0.0,50.0]"
      waypoint_frame: "local"
      entry_mode: "mid_flight"
    timeout_s: 480
