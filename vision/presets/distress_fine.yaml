# ② 조난자 구역 fine — 초록 매트 내부 흰 박스 확인 + 착륙점 산출 (vision_plan.md §5.3)
# "fine(≤~15m): 중앙 흰 박스(고명도 blob) → 박스 옆 빈 초록면 착륙"
#
# distress_coarse.yaml(초록 HSV ColorFilter + RectDetector)을 앞단으로 그대로 재사용하고
# 뒤에 white_box_detector(modules/distress_box.py)를 잇는 캐스케이드다.
#
# --- 캐스케이드 vs 독립 실행 판단(vertiport_fine.yaml과 반대) ---
# vertiport_fine.yaml(ArUco)은 일부러 vertiport_coarse.yaml과 **독립 실행**이다 — ArucoDetector가
# ROI 인자 없이 state.original 전체 프레임에서 찾고 state.detections를 통째로 덮어써서, coarse
# 뒤에 이으면 coarse가 확정한 결과가 조용히 사라지기 때문(그 yaml 헤더 주석 참조).
# 이번 건은 **반대로 캐스케이드가 맞다** — white_box_detector는 vertiport_v.py/vertiport_ring.py와
# 같은 패턴으로 "이전 단계(매트) detections를 ROI로 읽고 그 안에서만 찾아 자기 결과로 덮어쓴다".
# 흰 박스는 실제로 매트 *안*에 물리적으로 있으므로(§2 "정중앙 20cm 흰 사무박스") 매트 bbox를
# ROI로 좁혀 찾는 것이 자연스럽고, coarse의 확정 결과를 파괴하는 게 아니라 그 위에 검증을
# 하나 더 얹는 것이다.
#
# --- rect_detector min_area/max_area — distress_coarse.yaml 값을 그대로 복사하지 않은 이유 ---
# distress_coarse.yaml의 8000/200000은 coarse 대역(40~15m)에서 도출됐다. fine은 ≤~15m 근접
# 대역이라 매트가 훨씬 크게 보인다 — 그대로 복사하면 근접 시 매트가 max_area를 넘겨 통째로
# 놓칠 위험이 있다. distress_coarse.yaml과 동일 공식(gw(h)=2h·tan(75°/2)≈1.535h, 다운스케일
# 1536px 기준, 근거는 vision/CLAUDE.md)으로 fine 대역 양끝에서 재계산:
#   h=15m(fine 상한, 가장 작게 보이는 경계) -> 한 변 ~200px, 면적 ~40,053px²
#   h=3m (state_machine.py의 terminal_agl_m 기본값 — 이 밑은 TERMINAL 블라인드 하강으로
#         전환되어 fine 비전이 더 이상 필요 없어지는 근사 하한) -> 한 변 ~1000px, 면적 ~1,001,401px²
# distress_coarse.yaml과 동일한 마진 스타일(하한 ~명목값의 35%, 상한 ~명목값의 2.2배)을 적용:
#   min_area = round(0.355 * 40,053) ≈ 14,219 -> 14000
#   max_area = round(2.222 * 1,001,401) ≈ 2,225,114 -> 2,200,000
#
# --- white_box_detector 파라미터 도출 근거 ---
# 실측 스펙(vision_plan.md §2): 매트 3.0m 한 변, 흰 박스 20cm 정중앙 배치
#   -> 박스/매트 선형비 = 0.2/3.0 ≈ 0.0667, 면적비 ≈ 0.00444.
# 이 비율은 **매트 픽셀 bbox 대비 상대값**이라 고도(GSD)에 무관하게 불변이다(매트와 박스
# 둘 다 같은 GSD로 함께 스케일되므로) — rect_detector의 절대 px² 임계값과 달리 altitude tier별로
# 다시 계산할 필요가 없다(장점).
#   min_area_ratio=0.0015 — 명목값(0.00444)의 약 1/3. 이진화 경계/안티에일리어싱으로 박스가
#     다소 작게 검출돼도 통과하는 여유.
#   max_area_ratio=0.02 — 명목값의 약 4.5배. 근접·블러로 다소 과대추정돼도 통과하되, 매트
#     대부분을 채우는 오탐(예: 조명 반사로 마스킹된 초록 매트 자체 일부)은 배제.
#   min_solidity=0.85 — 박스는 꽉 찬 사각형이라 볼록성(solidity)이 높아야 함.
#   max_aspect_ratio=1.4 — 박스는 정사각형에 가까움(20cm 정사각 추정) — 원근 왜곡 여유 반영.
pipeline:
  color_filter:
    mode: color
    hue_range: [35, 85]
    sat_min: 80
    val_min: 60

  morphology:
    ops: [close, open]
    kernel_size: 5

  rect_detector:
    min_area: 14000
    max_area: 2200000
    approx_epsilon: 0.04
    min_solidity: 0.7

  white_box_detector:
    val_min: 180
    sat_max: 60
    min_area_ratio: 0.0015
    max_area_ratio: 0.02
    min_solidity: 0.85
    max_aspect_ratio: 1.4
    roi_margin: 0.05
    interior_margin_ratio: 0.3
