# fc_ros 노드 공통 파라미터
# config.py 설정을 ROS2 파라미터로 이관

offboard_node:
  ros__parameters:
    # 제어 루프
    control_hz: 10.0          # 세트포인트 송신 주파수 (PX4 watchdog: ≥2Hz)
    l1_dist: 20.0             # L1 lookahead 거리 (m)

    # 기체 타입: "vtol"(기본) | "mc"(순수 멀티콥터 — MC↔FW 천이 단계 생략)
    # 런타임 오버라이드: ros2 launch fc_ros phase2.launch.py vehicle_type:=mc
    vehicle_type: "vtol"

    # 진입 모드
    entry_mode: "pre_takeoff" # "pre_takeoff" | "mid_flight"

    # mid_flight WP0 진입 기준
    wp0_entry_radius: 5.0     # WP0 도달 판정 반경 (m)
    # 헤딩 허용 오차 (rad) ≈ 15° — 2026-07-29 사용자 지시로 0.05(≈2.9°)에서 확대.
    # 종전 2.9°는 구조적으로 너무 빡빡했다(F-7): 정렬 완료 시 잔류 오차가 −2.5°로
    # 고착돼 실질 마진이 0.4°뿐이었고, 바람 8m/s 에서 정렬 허용대 재이탈이
    # 0 → 12.5° 로 튀었다. _FW_STABLE_REQ 틱 연속 조건이라 마진이 없으면 카운터가
    # 계속 리셋돼 TRANSITION_FW 에서 못 빠져나온다(R1 타임아웃이 받아내긴 한다).
    # ⚠ ENTRY 의 WP0 도달 판정과 공용이다(offboard_node.py :1127 천이정렬 / :1877 ENTRY).
    wp0_heading_tol: 0.2618
    v_approach: 5.0           # ENTRY 접근 속도 (m/s)

    # TwistStamped frame_id — CC 환경의 MAVROS 버전에 따라 변경
    # "base_link" 또는 "local_origin"
    cmd_vel_frame_id: "local_origin"

    # 경로 계획 (main() entry_point 전용)
    # "auto": 기체 타입 자동 선택(mc→straight, vtol→eta3). 명시 지정("eta3"/"straight"/"diterpin")은 그대로.
    planner: "auto"
    # ROS2 파라미터는 중첩 리스트 불가 → flat 1D, 코드에서 reshape(-1, 3)
    waypoints: [0.0, 0.0, 50.0, 300.0, 0.0, 50.0]

    # waypoints 해석 기준계 (2026-07-25 사고 대응)
    #   "takeoff"(기본) — 이륙 순간 기체 위치가 원점. [0,0,3] = 이륙지점 상공 3m
    #   "local"         — EKF 로컬 프레임 절대좌표 (종전 동작)
    # EKF 로컬 원점은 이륙지점과 무관하다. 2026-07-25 flight01에서 원점이
    # 이륙지점으로부터 수평 10.94m·수직 10.55m 어긋나 [0,0,3]이 실제로는
    # "10.9m 옆 + 13.55m AGL"을 지령했고 조종사 KILL로 끝났다.
    # 근거: logs/2026-07-25_flight01/notes.md
    waypoint_frame: "takeoff"

    # 기체 파라미터
    #
    # v_cruise — **정식값 확정 (2026-07-28, 사용자 결정). "임시값" 아니다.**
    #
    # ⚠️ 이 값은 **실제 비행속도를 지정하지 않는다.** 오프보드에서는 순항속도를
    #    지정할 수 없다 — PX4 가 `_pos_sp_triplet.current.cruising_speed` 를
    #    무조건 NaN 으로 덮어쓰기 때문이다(FixedWingModeManager.cpp 오프보드
    #    변환 블록, 근거: docs/sitl_vtol_remediation_plan.md §1-3 6번).
    #    실제 대기속도를 정하는 것은 오직 PX4 파라미터 `FW_AIRSPD_TRIM` 이다.
    #    ⇒ v_cruise 가 좌우하는 것은 **플래너가 그리는 경로 형상(선회반경)과
    #      경로 생성 블로킹 시간** 뿐이다.
    #
    # 18.0 의 근거 (실기체 실측 파라미터, 2026-07-27 MAVROS 조회):
    #    FW_AIRSPD_MIN 10.0 / **FW_AIRSPD_TRIM 15.0** / FW_AIRSPD_MAX 20.0
    #    선회반경을 지배하는 것은 대기속도가 아니라 **지상속도**다. 기체는
    #    trim 15 m/s 로 날지만 배풍에서는 지상속도가 그보다 커지고, 플래너가
    #    15 로 그린 경로는 그 순간 기체가 돌 수 없는 반경이 된다.
    #    → **18.0 = trim 15 + 배풍 마진 3 m/s.**
    #      20.0(마진 5, = FW_AIRSPD_MAX 상한)과 15.0(마진 0)의 절충값이다.
    #      낮출수록 위험(못 도는 선회를 계획), 높일수록 경로가 헐거워지고
    #      경로 생성 블로킹이 급격히 늘어난다(아래).
    #
    # 경로 생성 블로킹 비용 (2026-07-28 실측,
    #    tools/sitl/measure_planner_blocking.py, WSL Ubuntu-22.04, SITL 부하 없음):
    #        v_cruise  |  15    16    17     18     20
    #        L자 3WP   | 0.47  0.46  23.4   26.1   21.5  s
    #        폐회로5WP | 28.8  27.4  101.8  99.4   103.2 s
    #    **매끄러운 곡선이 아니라 16↔17 사이의 계단이다.** 그리고 그 계단은
    #    비용만이 아니라 **경로 품질의 계단**이기도 하다 — 같은 실측의
    #    플래너 NR 잔차가 ≤16 에서 L자 35.6m / 폐회로 8.3m 인데
    #    ≥17 에서는 둘 다 ≈5.0m 다. 즉 15~16 이 싼 이유는 **NR 이 일찍
    #    포기해 변형된 곡선을 내놓기 때문**이지 계산이 쉬워서가 아니다.
    #    ⇒ **18.0 은 20.0 과 같은 품질대역에 있으면서 비용도 20.0 과 같다.**
    #      "18 로 낮춰 계산시간을 아낀다"는 성립하지 않는다 —
    #      18 을 고르는 이유는 위의 배풍 마진 유도이지 계산비용이 아니다.
    #    (SITL 실비행 중에는 gz·PX4 와 CPU 를 나눠 써 1.1~2.6배로 늘어난다:
    #     v_cruise=20 실측 L자 55.9s / 폐회로 188.5s,
    #     v_cruise=18 실측 L자 57.6s / 폐회로 223.6s.
    #     원본 logs/2026-07-27_r2_follow_robustness/, logs/2026-07-28_vc18/)
    #
    # 20.0 → 18.0 이 경로를 바꾸는가: **사실상 안 바꾼다** (2026-07-28 실측,
    #    tools/sitl/compare_planner_paths.py — 호길이 정규화 후 점대점 거리):
    #        v_cruise 18 vs 20 → 최대 괴리 **0.23m** (평균 0.02m), 경로점·전장 동일
    #        v_cruise 17 vs 20 → 최대 괴리 0.13m
    #        v_cruise 16 vs 20 → 최대 괴리 **21~26m**, 경로점 수까지 달라짐
    #        v_cruise 15 vs 20 → 최대 괴리 **15~31m**
    #    (경로: A3 L자 / B5 사각폐곡선 / R2_closed 완전폐회로)
    #    ⇒ 위 "16↔17 계단"은 비용·품질만이 아니라 **경로 형상의 계단**이다.
    #      18 로 내리는 것은 경로를 20cm 남짓 바꾸는 무해한 변경이지만,
    #      15~16 으로 내렸다면 경로가 통째로 달라졌을 것이다.
    #
    # 참고 — v_cruise 는 속도 프로파일(`compute_speed_profile`)도 만들지만
    #    그 결과(`L1Guidance.compute()` 의 v_cmd)는 offboard_node 가 버린다
    #    (offboard_node.py: `chi_cmd, _, cte = self._guidance.compute(...)`).
    #    즉 같은 품질대역 안에서는 v_cruise 가 비행 거동에 남기는 경로가 없다.
    #
    # 변경하려면: 위 유도(지상속도 = trim + 배풍 마진, 상한 FW_AIRSPD_MAX)를
    #    먼저 다시 밟을 것. 실기체 FW_AIRSPD_TRIM 이 바뀌면 이 값도 함께 바뀐다.
    v_cruise: 18.0            # m/s  (정식값 — 위 주석이 근거)
    a_max_g: 0.3              # g 단위 횡방향 가속도 상한
    gravity: 9.81

    # 자율 비행 시퀀스 파라미터 (작업 A)
    transition_alt:  50.0     # 천이 고도 (m, pos_ned[2] h_up 양수)
    d_end_thresh:    10.0     # 역천이 진입 거리 기준 (m, FW/VTOL 대형 항로용)
    mc_end_thresh:   1.0      # MC 웨이포인트(경로점) 도달 판정 반경 (m) — MC는
                              # L1Guidance 대신 self._pts를 이산 순차추종(WP0→
                              # WP1→...)한다(2026-07-24, 사용자 지적: MC는 직선
                              # 구간이라 FW용 연속경로 guidance가 불필요, 왕복
                              # 경로에서 L1Guidance가 고정점에 수렴해 완주 못
                              # 하고 멈추는 문제도 실측됨). d_end_thresh(FW/VTOL
                              # 300m급 항로 기준 10.0m)와 별개 값.
                              # 2026-07-27: 2.0 → 1.0. 아래 정착 판정 도입으로
                              # 기체가 WP 위에 실제로 수렴할 때까지 기다리므로
                              # 반경을 조여도 놓칠 위험이 없다(실측 WP 최근접
                              # 0.10~0.64m, logs/2026-07-25_review.md).

    # MC 웨이포인트 정착 (2026-07-27) — WP에 멈춰 선 것을 확인하고 다음 WP로
    # 출발한다. 종전엔 반경 경계를 스치는 순간 목표가 바뀌어 WP 위에 가보지도
    # 않고 코너를 잘랐다(2026-07-25 flight04: 1.8~1.9m에서 통과 판정).
    # MC는 호버가 되므로 정착이 자연스럽고, "찍은 경로대로 가는지"를 보는
    # 이 테스트기체의 목적에도 맞다. settle_time을 0.0으로 주면 종전 동작.
    mc_wp_settle_speed: 0.3   # 정착 판정 수평속도 임계 (m/s)
    mc_wp_settle_time:  1.0   # 정착 유지 시간 (s) — 이 시간 연속 유지해야 다음 WP
    mc_wp_timeout:     20.0   # WP당 정착 타임아웃 (s) — 초과 시 경고 후 강제 진행
    landing_timeout: 60.0     # AUTO.LAND 타임아웃 (s)
    v_terminal:      15.2     # 경로 끝점 도달 속도 (m/s, 스톨 13.8×1.1)
    decel_dist:      80.0     # 종단 감속 시작 거리 (m)

    # WP1 지점 착륙 (역천이 오버슈트 후 MC로 WP1 복귀·홀드 → 그 자리 착륙)
    wp1_land_radius: 3.0      # WP1 착륙 도달 반경 (m)
    wp1_land_speed:  1.5      # 착륙 전 안정 수평속도 임계 (m/s)
    hold_timeout:    30.0     # WP1 홀드 타임아웃 (s)

    # ── 상태 타임아웃 4종 + 거리 상한 (2026-07-27, SITL-7 R1) ────────────────
    #
    # 왜: 상태 12개 중 탈출 타임아웃이 있던 것은 HOLD(30s)·OVERRIDE(1s)·
    # LANDING(경고만) 셋뿐이었고, 나머지 9개는 조건이 오지 않으면 영구 대기했다.
    # C10 실측 — `entry_mode:=mid_flight` 파라미터 하나로 ENTRY가 432.67초 내내
    # 탈출하지 못했고 기체가 이륙지점에서 5.85km 이탈했다(장애주입 없음).
    # 스트림이 살아 있어 PX4 offboard-loss 페일세이프도 안 걸린다.
    # 근거: logs/2026-07-27_sitl_vtol_campaign/campaign_report.md §1·§4 (F-1/F-2/F-3),
    #       각 런 metrics.json 의 state_windows_ulog_s.
    #
    # 규약: 초 단위 float, **0 이하이면 비활성**(종전 무한대기 동작), 경계 strict >.
    #   hold_timeout·mc_wp_timeout·landing_timeout 과 동일하다.
    # ⚠️ 단 초과 시 동작이 다르다 — mc_wp_timeout 류의 "강제 진행"이 아니라
    #   **안전 폴백**이다. `_request_override()`(MC→POSCTL / FW→MANUAL 시도,
    #   미진입 시 10틱 뒤 AUTO.LOITER)로 떨어지고 setpoint 발행이 멈춘다.
    #   S7에서 실증된 안전경로를 그대로 재사용한다 — 새 경로를 만들지 않는다.
    #
    # ⚠️ 기본값은 "종전 동작 보존(0=비활성)"이 아니라 **활성**으로 넣는다.
    #   끄고 배포하면 실기체에 아무 효과가 없다. 아래 값은 캠페인 24런의
    #   실측 체류시간에서 유도했고, 전 런 최대값 대비 3.8~4.5배 여유가 있다.

    # CLIMBING 체류 상한. 실측(state_windows_ulog_s):
    #   transition_alt=50m  n=29런  25.00~31.91s (최대 A3_pxvehicle)
    #   transition_alt=20m  C1a     16.98s
    #   transition_alt=120m C1b     52.11s
    #   → 2점 회귀: 체류 ≈ 9.95 + 0.3513×AGL(m)  (상승률 2.85 m/s)
    # 120.0 은 50m 최대(31.91s)의 3.76배, 120m(52.11s)의 2.30배.
    # 회귀식으로는 AGL 313m 상승까지 걸리지 않는다 — 대회 운용고도(50m)의 6배.
    # 잡는 것: 래치된 home_amsl / MIS_TAKEOFF_ALT 폴백으로 PX4가 다른 고도에
    # 이륙해 판정 허용대(±0.5m, |vz|<=0.3)에 영영 못 들어오는 경우.
    climbing_timeout:      120.0

    # TRANSITION_FW 체류 상한. 실측 n=30런 6.81~20.08s (최대 A4, 최소 C2).
    # 내역: Phase1 프라이밍 2.0s + Phase2 헤딩정렬 + Phase3/4 정천이 2.42~2.60s.
    # 정렬시간은 회전량에 비례 — C2(4°) 6.81s vs C1a(95.3°) 19.08s
    #   → 0.134 s/deg. 180° 회전 최악값 외삽 ≈ 6.81 + 176×0.134 ≈ 30.5s.
    # 90.0 은 실측 최대(20.08s)의 4.48배, 180° 외삽(30.5s)의 2.95배.
    # 이 구간은 대부분 MC 호버라 시간이 싸다(제자리 대기).
    # 잡는 것: 천이 명령 거부 시 MC로 종점까지 가서 영구 호버(F-3),
    #        바람으로 정렬 20틱을 못 채워 갇히는 경우(F-7, C4에서 허용대
    #        재이탈 12.5° 실측).
    transition_fw_timeout:  90.0

    # TRANSITION_MC 체류 상한. 실측 n=26런 4.64~7.55s (최대 A2).
    #   (ulog vtol_state 기준 역천이 자체는 4.92~6.09s)
    # 30.0 은 실측 최대(7.55s)의 3.97배.
    # 여기만 유독 위험도가 높다 — 실패 시 FW가 `_end_dir` 방향으로 무한 직진하고
    # (목표점이 매 틱 현재위치 앞 70m로 다시 놓이는 "도망가는 캐럿"),
    # 스트림이 살아 있어 PX4 페일세이프도 안 걸린다(F-2). 아래 거리 상한과 이중 방어.
    transition_mc_timeout:  30.0

    # ENTRY 체류 상한. **성공 사례가 캠페인 24런 중 0건**이라 실측 상한이 없다
    # — 유일한 관측치가 실패(C10: 432.67s 체류, 5.85km 이탈)다. 그래서 설계값에서
    # 유도한다: 접근속도 v_approach=5.0 m/s × 60s = 300m, 즉 yaml 기본 경로
    # 전장(300m)만큼을 통째로 접근하고도 남는 시간이다. 실제 ENTRY 이탈률
    # (C10: 5.85km/432.67s = 13.5 m/s)로도 60s면 ~810m — 다만 그 전에 아래
    # 거리 상한(300m)이 약 22초에 먼저 잡는다. 4종 중 가장 짧게 잡은 이유는
    # ENTRY가 **무한 이탈이 실측된 유일한 상태**이기 때문이다.
    entry_timeout:          60.0

    # 이륙지점 기준 수평거리 상한 (m). 초과 시 안전 폴백.
    # 300.0 — 사용자 확정값(2026-07-27). 상태머신이 어디서 막혔든, 어떤 이유로
    # 목표점이 도망갔든 작동하는 마지막 기하학적 제동장치다.
    # 선례: 하니스 tools/sitl/run_scenario.py 의 RangeGuard(기본 1500m)가 C7에서
    # 1564m에 실제 발동해 7km 비행을 막았다. 그러나 **하니스는 실기체에 없다**
    # — 같은 감시를 노드 안에 넣은 것이 이 파라미터다.
    # 기준점은 waypoint_frame 설정과 무관하게 항상 실제 이륙지점이다
    # (EKF 로컬 원점은 이륙지점과 다르다 — 2026-07-25 flight01 실측 10.94m 차이).
    #
    # ⚠️ 위 `waypoints` 기본값(정북 300m)은 이 상한과 정확히 맞물린다 —
    #   FW 역천이가 종점을 약 47m 지나치므로(d_end_thresh=10 기준) 기본 경로를
    #   그대로 날리면 종점 부근에서 이 감시가 발동한다. 대회 경로는 폐회로라
    #   이륙지점에서 300m를 넘지 않지만, **긴 편도 경로를 시험할 때는
    #   `range_limit_m:=<값>` launch 인자로 함께 키울 것.**
    #   이륙 직전 노드가 "계획 경로가 거리 상한 밖이다" 경고를 찍어 알려준다.
    range_limit_m:         300.0

    # ── FW 위치 setpoint 고도 램프 (2026-07-29, SITL-7 R5 / F-9) ────────────
    #
    # 왜: `transition_alt != waypoints[-1].z` 이면 **천이 첫 틱 한 번에** 고도
    # setpoint 가 `wp[-1].z - transition_alt` 만큼 통째로 튄다. TRANSITION_FW
    # Phase 2 까지는 속도 setpoint(hover)라 위치 setpoint 의 고도 성분이 아예
    # 없다가, 헤딩 정렬이 끝난 틱에 `_cruise_alt` 절대값이 그대로 나가기 때문.
    #   SITL 실측  C1a(transition_alt 20m) **+30.12m** (h_up 19.92→50.03)
    #             C1b(transition_alt 120m) **−69.78m** (119.77→49.99)
    #   실기체 실측 2026-07-28 flight02 **−29.6m**
    #             (launch 인자 유실로 transition_alt=50m, wp[-1].z=21.2m)
    # 피해: C1a 는 300m 전 구간을 순항고도 미달로(22→49m), C1b 는 종점에서
    # 고도가 아직 88m 라 종점 포착 실패 → 2바퀴 선회 + **수직가속 2.111g**
    # (캠페인 최대). 근거: campaign_report.md §2 「고도 계단」·§4 F-9.
    #
    # 규약: m/s, **0 이하이면 비활성**(종전 = 한 틱에 절대값 발행).
    # 램프는 `_cruise_alt` 에 닿으면 정확히 안착하므로 수렴 후 동작은 종전과 동일.
    # 걸리는 곳은 FW 위치 setpoint 4곳뿐(STREAMING/TRANSITION_FW/FOLLOWING/
    # TRANSITION_MC) — MC 분기·HOLD·비전 상태는 이미 3D 슬루가 걸려 있다.
    #
    # 3.0 인 이유 — **기체가 실제로 낼 수 있는 수직속도보다 빠르게** 잡는다.
    #   PX4 실측 수직 응답: C1b 하강 1.8 m/s / C1a 상승 평균 ≈1.4 m/s
    #   (22→49m 를 FOLLOWING 19.0s 에 걸쳐).
    #   3.0 은 그 1.7~2.1배라 **램프가 기체 궤적의 병목이 되지 않는다** —
    #   즉 고도 수렴을 늦추지 않으면서(C1b 의 종점 포착 실패 F-10 을 악화시키지
    #   않으면서) 지령 계단만 없앤다.
    #   틱당 이동은 3.0 × dt(0.1s) = **0.3m** 로, 하니스 setpoint_jump 임계
    #   (3 × v_approach × dt = 1.5m)의 1/5 이다.
    # ⚠️ 더 낮추면(예: 1.5) 계단은 더 부드러워지지만 30m 계단 수렴에 20초가
    #   걸려 300m 경로를 통째로 저고도로 날게 된다 — C1a 의 피해를 램프가
    #   재현하는 꼴이다. 낮출 거면 반드시 C1a 로 재측정할 것.
    # ⚠️ 이 값은 계단을 **완화**할 뿐 원인을 없애지 못한다. 원인은
    #   `transition_alt` 와 경로 고도의 불일치이고, 그 둘을 맞추는 것이 정답이다
    #   (노드가 5m 초과 불일치에 이륙 후 WARN 을 찍는다).
    alt_slew_rate:           3.0

    # ── 비전 정밀착륙 F2 (2026-07-29 노출) ──────────────────────────────────
    #
    # 계약·근거 정본은 `docs/fc_precision_land_handoff.md` §8(파라미터 레퍼런스).
    # 여기 값은 그 문서와 `offboard_node.py` 의 declare_parameter 기본값과
    # **3중으로 같아야 한다**(test_params.py 가 고정한다).
    #
    # 🔴 2026-07-29 이전에는 이 블록도 launch 인자도 없어서, launch 인자 위생
    # 검사가 미선언 인자에 RuntimeError 를 던지는 탓에
    # `phase2.launch.py vision_landing:=true` 가 **launch 단계에서 실패**했다 —
    # 즉 실기체에서 F2 를 켤 방법 자체가 없었다.

    # 🔴 마스터 스위치. **false 가 계약이다** — 실기체 FW+OFFBOARD 실적이 0건이라
    # `sitl_vtol_remediation_plan.md` §4-1 4번이 "첫 실비행에 미검증 변수를 둘로
    # 만들지 말라"를 명문화하고 있다. false 면 비전 토픽 **구독조차 만들지 않아**
    # HOLD→LANDING 종전 경로와 100% 동일하다. 켜는 것은 별도 결정이고,
    # 시험은 YAML 이 아니라 `phase2.launch.py vision_landing:=true` 로 한다.
    vision_landing:          false

    vision_search_alt:        25.0   # 탐색고도(AGL, m). 검출 상한 33.57m 대비 8.6m 여유
    vision_search_radius:     30.0   # 최대 탐색반경(m). 실효 커버는 반경+풋프린트단폭/2 = 39.4m
    vision_search_spacing:     0.0   # 링 간격(m). 0 이하면 풋프린트에서 자동 산출(겹침 35%)
    vision_search_speed:       0.0   # 선회속도 **상한**(m/s). 0 이하면 v_approach
    vision_search_dwell:       3.0   # 탐색고도 도달 후 제자리 확인(s)
    # 🔴 실측 역산값 — 1회차가 정렬 5s + dwell 3s + 나선 89s = 97s 다.
    # 90s 로 잡으면 완주 직전에 잘린다. 반경·간격·속도를 바꾸면 같이 재라.
    vision_search_timeout:   120.0
    vision_retry_alt:         15.0   # 재탐색 회차 고도(AGL, m)
    vision_retry_radius:      18.0   # 재탐색 회차 최대 반경(m)
    # 🔴 단위는 **vision 프레임**이지 제어틱이 아니다(2026-07-29 수정).
    # 4.4Hz 실측에서 3프레임 ≈ 0.68s. 종전 "틱" 계수는 같은 메시지를 최대 10번
    # 세어 setpoint 1건으로 래치가 서 버렸다.
    vision_latch_frames:         3
    vision_latch_spread_m:     3.0   # 래치 좌표들의 수평 산포 상한(m)
    # 🔴 F2-a (2026-07-29). 래치를 허용하는 최대 AGL(m). **0 이하면 검출 상한에서
    # 자동 산출**한다(= 33.570m, `search_pattern.max_detection_altitude_m()`).
    # 래치는 "여기로 내려간다"는 되돌릴 수 없는 결정인데 종전엔 어느 고도에서든
    # 섰다 — 검증 R5 가 HOLD 고도 **49.6m**(상한 33.57m 초과)에서 래치해 그
    # 좌표로 하강을 시작했다. 게이트를 끄려면 큰 값을 명시하라(예: 1000.0).
    vision_latch_max_agl:      0.0
    # 🔴 실측 발행 4.4Hz(median 0.221s / p95 0.310s) 기준. 0.5s 로 잡으면 헛경보.
    vision_stale_timeout:      1.0
    vision_link_timeout:       3.0   # link ERROR 유효기간(하트비트 1Hz × 3)
    vision_veto_timeout:      10.0   # D-a. veto 지속 시 GPS 착륙 폴백까지의 시한(s)
    # 🔴 F2-d (2026-07-29). PRECISION_LAND 에서 **유도가 끊긴 채** 버티는 시한(s).
    # veto(10s)보다 짧다 — veto 는 vision 이 "지금은 내리지 마라"를 적극적으로
    # 말한 것이고 상실은 아무것도 모르는 상태다. shim 사망(status 까지 침묵)도
    # 이 시한이 잡는다. 종전엔 `_pl_lost_elapsed` 가 갱신만 되고 읽히지 않았다.
    vision_lost_timeout:       5.0
    # 🔴 F2-f (2026-07-29). VISION_SEARCH align 단계 상한(s). 초과 시 dwell 을
    # 건너뛰고 **강제로 나선**에 진입한다. align 통과조건의 수평 항이 HOLD
    # 타임아웃 조건과 같아(`dist(WP1) < wp1_land_radius`), 없으면 두 회차
    # 240s 를 통째로 태우고 GPS 폴백이 된다. 30s + 나선 89s = 119s 로
    # vision_search_timeout(120s) 안에 들어간다.
    vision_align_timeout:     30.0
    vision_align_tol:          1.0   # 이 안에 들어와야 하강한다(수평/수직 분리의 핵심)
    vision_descend_speed:      0.8   # 정렬 후 하강률(m/s)
    # 🔴 vision 의 `terminal_agl_m` 과 **같은 숫자여야 한다** — 계약상 3m 부터 AUTO.LAND.
    vision_land_handoff_agl:   3.0
    # 🔴 F2-b (2026-07-29). 정밀착륙 체류 상한(s) — 다만 **하한**이다. 실제 시한은
    # 래치 고도에서 max(이 값, 1.6 × 이상적 하강시간)으로 다시 계산된다
    # (`precision_land.precision_land_deadline_s`). 이 값 하나로 고정하면 높은
    # 고도에서 래치했을 때 하강만으로 시한을 넘긴다 — R5 는 49.6m 에서 래치해
    # 하강만 58.3s 가 필요했고, vision 의 land 힌트가 42s 에 구해줬을 뿐이다.
    precision_land_timeout:   60.0

mission_node:
  ros__parameters:
    # ROS2 파라미터는 중첩 리스트 불가 → flat 1D, 코드에서 reshape(-1, 3)
    waypoints: [0.0, 0.0, 50.0, 300.0, 0.0, 50.0]
