# ② 조난자 구역 coarse — 초록 사각 매트 검출 (vision_plan.md §5.3)
# "coarse(40~15m): 초록 사각 매트(자갈 위) -> HSV 초록 + 사각"
# 전용 검출 모듈은 아직 없다 — 기존 ColorFilter(mode=color)+RectDetector 조합만으로 구성
# (신규 코드 없음, 골든셋 회귀테스트 §7.9 항목7 용으로 추가한 프리셋).
# 은색 테두리·흰 박스 fine 단계, ③ 하기구역(빨간 십자 형상판별)은 전용 검출기 미구현 —
# 이 프리셋의 범위 밖.
#
# --- min_area/max_area 도출 근거 (2026-07-22, 실측 스펙 반영) ---
# 직전 감사에서 "GSD 미확정 상태의 임의값"으로 지적됐던 값을 실측 기반으로 재도출함.
# 매트 실측 3.0m×3.0m×0.105m 라이즈드 플랫폼(vision_plan.md §2/§5.3) — 버티포트 흰 필드와
# 동일 3m 풋프린트라 §4.1 GSD 표의 "3m 피처" 컬럼을 재사용하되, 그 표는 계획서 가정 화각
# 102°(H) 기준이고 실제 장착 카메라 실측 화각은 75°(docs/vision_status.md)이므로 75°로 재계산.
#
# 공식: 지상폭 gw(h) = 2·h·tan(75°/2) ≈ 1.535·h [m]  (§4.1과 동일하게 coarse 다운스케일
#       전체프레임 가정, 폭 1536px 기준 — §4.1 "다운스케일(1536px)" 컬럼과 동일 기준)
# GSD_down(h) = gw(h) / 1536 [m/px]
# 매트 한 변(3.0m) 픽셀 길이 = 300cm / (GSD_down(h)×100) ; 면적 = 한 변²
#
#   고도   지상폭(gw)   GSD_down    매트 한 변(px)   매트 면적(px²)
#   10m    15.35m       1.00cm/px   ~300px           ~90,000
#   20m    30.69m       2.00cm/px   ~150px           ~22,500
#   40m    61.39m       4.00cm/px   ~75px             ~5,625
#
# min_area=8000: 40m(~5,625px², 색/윤곽 열화 보수적으로 더 낮게 볼 여지 있음)는 확실히
#   배제하고, 20m(~22,500px²)는 실제 검출 시 색상 마스킹/윤곽 근사로 면적이 다소 줄어도
#   (예: 실제 검출 면적이 명목값의 ~35%까지 줄어도) 충분히 넘도록 여유 마진을 둠.
# max_area=200000: 10m(~90,000px²)보다 약 2.2배 여유 — 10m보다 더 근접하거나(coarse가
#   fine으로 전환되는 15m 하한 이전) 윤곽이 다소 과대추정돼도 통과하되, 프레임을 거의
#   채우는 배경 노이즈/오탐 blob은 걸러내는 상한 역할.
# 결과적으로 10m/20m는 검출, 40m는 (안전마진을 반영한 보수적 임계값 기준으로) 미검출 —
# 골든셋(vision/tests/golden/distress/)과 정합됨. 상세 도출 과정은 vision/CLAUDE.md 참조.
pipeline:
  color_filter:
    mode: color
    hue_range: [35, 85]
    sat_min: 80
    val_min: 60

  morphology:
    ops: [close, open]
    kernel_size: 5

  rect_detector:
    min_area: 8000
    max_area: 200000
    approx_epsilon: 0.04
    min_solidity: 0.7

  # 사전정보(기지 크기 3.0m + 라이다 AGL + 기체 자세) 기반 **후보 랭킹** (modules/prior_score.py).
  # 🔴 게이트가 아니다 — 후보를 제거하지 않고 점수만 붙여 정렬한다. 위 min_area/max_area 하드
  # 필터를 대체하지도 않는다(그 뒤에 랭킹만 얹는다). 사전정보(AGL·자세)가 없으면 **자동 비활성**
  # 이라 지금(=자세 텔레메트리 없음) 동작은 이 스텝이 없을 때와 완전히 동일하다.
  # distress_mat_geometry **앞**에 둔다: main.py/replay.py가 `meta["distress_mat"]`이 붙은
  # **첫** 검출을 pose 산출 대상으로 고르므로, 정렬이 먼저 끝나야 1등 후보가 선택된다.
  prior_geometry_scorer:
    target_size_m: 3.0

  # 상대 pose 산출용 기하 태깅 (modules/distress_mat.py). 검출을 더하거나 빼지 않는다 —
  # rect_detector가 낸 매트 후보의 4코너를 solvePnP 대응 순서로 정규화해 meta에 싣는다.
  # **이 스텝이 있다는 것 자체가 "초록구역 pose 산출기를 쓰라"는 신호**다(main.py가 preset
  # 경로 문자열을 파싱하지 않고 meta["distress_mat"] 존재 여부로 경로를 고른다) — 같은
  # rect_detector를 쓰는 범용 video.yaml이 3m 매트 크기를 실수로 적용받는 일이 없다.
  # coarse에는 white_box_detector가 없으므로 착륙점은 매트 중심으로 degrade한다(그 사실은
  # landing_point_source="mat_center" + target_type="distress_mat_center"로 소비자에게 전파).
  distress_mat_geometry:
    size_m: 3.0
    platform_height_m: 0.105
